<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake 🐍</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
  canvas { background:#1b1b1b; border:3px solid #4caf50; max-width:95vw; }
  #info { margin:10px; font-size:20px; }
</style>
</head>
<body>
<div id="info">Puntos: <span id="score">0</span> | Récord: <span id="best">0</span></div>
<canvas id="c" width="400" height="400"></canvas>
<p>Flechas o WASD para mover · Espacio para reiniciar</p>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const size = 20, cells = canvas.width / size;
let snake, dir, nextDir, food, score, best = 0, over, timer;

function start() {
  snake = [{x:10, y:10}, {x:9, y:10}, {x:8, y:10}];
  dir = {x:1, y:0}; nextDir = dir;
  score = 0; over = false;
  placeFood();
  document.getElementById('score').textContent = score;
  clearInterval(timer);
  timer = setInterval(tick, 110);
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random()*cells), y: Math.floor(Math.random()*cells)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    over = true;
    clearInterval(timer);
    if (score > best) { best = score; document.getElementById('best').textContent = best; }
    draw();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#1b1b1b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ff5252';
  ctx.fillRect(food.x*size, food.y*size, size-2, size-2);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#8bc34a' : '#4caf50';
    ctx.fillRect(s.x*size, s.y*size, size-2, size-2);
  });
  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('¡Perdiste! 💀', 200, 190);
    ctx.font = '18px sans-serif';
    ctx.fillText('Tocá Espacio para reiniciar', 200, 225);
  }
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((k === 'arrowup' || k === 'w') && dir.y === 0) nextDir = {x:0, y:-1};
  else if ((k === 'arrowdown' || k === 's') && dir.y === 0) nextDir = {x:0, y:1};
  else if ((k === 'arrowleft' || k === 'a') && dir.x === 0) nextDir = {x:-1, y:0};
  else if ((k === 'arrowright' || k === 'd') && dir.x === 0) nextDir = {x:1, y:0};
  else if (k === ' ' && over) start();
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
});

start();
</script>
</body>
</html>
